name: Publish press-release RSS feed

# Rebuilds the clean press-release feed from HubSpot and replaces the hosted
# file in place. The public URL never changes:
#   https://b2idigital.com/hubfs/press-release-feed.xml
#
# Runs every 30 minutes. When a new press release is published to the
# press-release blog, it appears in the feed within 30 minutes with no
# manual step.

on:
  schedule:
    - cron: "5,35 * * * *"    # every 30 minutes, at :05 and :35
  workflow_dispatch:           # lets you trigger it by hand right after publishing
    inputs:
      force:
        description: "Upload even if the feed has not changed (use to test the token)"
        type: boolean
        default: false
      remove_match:
        description: "One-off: remove any hosted <item> whose XML contains this substring (e.g. a post slug), instead of the normal rebuild. Leave blank for the normal run."
        type: string
        default: ""

# Stops two runs from uploading at the same time.
concurrency:
  group: press-release-feed
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet pillow

      - name: Check blog-posts read scope on HUBSPOT_TOKEN
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/scope_check.json -w '%{http_code}' \
            -H "Authorization: Bearer ${HUBSPOT_TOKEN}" \
            "https://api.hubapi.com/cms/v3/blogs/posts?limit=1")
          echo "HTTP $code"
          cat /tmp/scope_check.json
          echo
          if [ "$code" = "200" ]; then
            echo "SCOPE OK: token can read blog posts"
          else
            echo "SCOPE MISSING or other error: token cannot read blog posts (see body above)"
          fi

      - name: One-off - remove a matching item from the hosted feed
        if: ${{ inputs.remove_match != '' }}
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          HUBSPOT_FILE_ID: "220866599267"
        run: python remove_feed_item.py --match "${{ inputs.remove_match }}"

      - name: Build and publish feed
        if: ${{ inputs.remove_match == '' }}
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          HUBSPOT_FILE_ID: "220866599267"
        run: python publish_feed.py ${{ inputs.force && '--force' || '' }}

      - name: Verify the live feed
        run: |
          set -e
          sleep 20
          curl -sS -H 'Cache-Control: no-cache' \
            "https://b2idigital.com/hubfs/press-release-feed.xml?cb=${GITHUB_RUN_ID}" \
            -o live.xml
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          x = open("live.xml", encoding="utf-8").read()
          ET.fromstring(x)                                   # must parse
          assert "<![CDATA[<![CDATA[" not in x, "double CDATA regression"
          assert "__ptq.gif" not in x, "tracking pixel regression"
          assert "b2idigital.com/news" not in x, "news content leaked in"
          n = x.count("<item>")
          removing = "${{ inputs.remove_match }}" != ""
          if not removing:
              assert n > 0, "feed has no items"
          print("live feed OK: %d item(s), %d bytes" % (n, len(x.encode())))
          PY
