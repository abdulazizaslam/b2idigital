name: Publish press-release RSS feed

# Rebuilds the clean press-release feed from HubSpot and replaces the hosted
# file in place. The public URL never changes:
#   https://b2idigital.com/hubfs/press-release-feed.xml
#
# Runs every 30 minutes. When a new press release is published to the
# press-release blog, it appears in the feed within 30 minutes with no
# manual step.

on:
  schedule:
    - cron: "5,35 * * * *"    # every 30 minutes, at :05 and :35
  workflow_dispatch:           # lets you trigger it by hand right after publishing
    inputs:
      force:
        description: "Upload even if the feed has not changed (use to test the token)"
        type: boolean
        default: false
      remove_match:
        description: "One-off: remove any hosted <item> whose XML contains this substring (e.g. a post slug), instead of the normal rebuild. Leave blank for the normal run."
        type: string
        default: ""

# Stops two runs from uploading at the same time.
concurrency:
  group: press-release-feed
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet pillow

      - name: Validate new API-based builder against a blog with real posts
        if: ${{ inputs.remove_match == '__validate_builder__' }}
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: |
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          import build_pressrelease_feed as b

          token = os.environ["HUBSPOT_TOKEN"]
          posts = b.fetch_published_posts(token, content_group_id="156108386373")
          print("fetched %d total published posts; sampling first 3" % len(posts))
          posts = posts[:3]

          # Reuse build()'s per-item logic on just the sampled posts.
          out = []
          for post in posts:
              title = post.get("htmlTitle") or post.get("name") or ""
              link = post.get("url") or ""
              pub = b.iso_to_rfc822(post.get("publishDate"))
              body_raw = post.get("postBody") or ""
              img = b.first_image(body_raw)
              body = b.clean_body(body_raw, title)
              parts = [
                  "    <title>%s</title>" % b.esc(title),
                  "    <link>%s</link>" % b.esc(link),
                  '    <guid isPermaLink="true">%s</guid>' % b.esc(link),
                  "    <pubDate>%s</pubDate>" % pub,
                  "    <dc:creator>%s</dc:creator>" % b.CREATOR,
                  "    <category>%s</category>" % b.esc(b.CATEGORY),
              ]
              if img:
                  mime, w, h, nbytes = b.image_meta(img)
                  dims = ' width="%d" height="%d"' % (w, h) if w and h else ""
                  size = ' fileSize="%d"' % nbytes if nbytes else ""
                  parts.append('    <media:content url="%s" medium="image" type="%s"%s%s />' % (b.esc(img), mime, dims, size))
                  parts.append('    <media:thumbnail url="%s"%s />' % (b.esc(img), dims))
                  if nbytes:
                      parts.append('    <enclosure url="%s" type="%s" length="%d" />' % (b.esc(img), mime, nbytes))
              parts.append("    <description>%s</description>" % b.cdata(body))
              parts.append("    <content:encoded>%s</content:encoded>" % b.cdata(body))
              out.append("  <item>\n" + "\n".join(parts) + "\n  </item>")

          xml_out = ('<?xml version="1.0" encoding="UTF-8"?>\n'
                      '<rss version="2.0"><channel>\n' + "\n".join(out) + "\n</channel></rss>\n")
          open("/tmp/test_build.xml", "w", encoding="utf-8").write(xml_out)
          ET.fromstring(xml_out)
          print("parses OK, %d sampled item(s), %d bytes" % (xml_out.count("<item>"), len(xml_out.encode())))
          PY
          echo "--- sample item ---"
          head -c 3000 /tmp/test_build.xml

      - name: One-off - remove a matching item from the hosted feed
        if: ${{ inputs.remove_match != '' && inputs.remove_match != '__validate_builder__' }}
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          HUBSPOT_FILE_ID: "220866599267"
        run: python remove_feed_item.py --match "${{ inputs.remove_match }}"

      - name: Build and publish feed
        if: ${{ inputs.remove_match == '' }}
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          HUBSPOT_FILE_ID: "220866599267"
        run: python publish_feed.py ${{ inputs.force && '--force' || '' }}

      - name: Verify the live feed
        run: |
          set -e
          sleep 20
          curl -sS -H 'Cache-Control: no-cache' \
            "https://b2idigital.com/hubfs/press-release-feed.xml?cb=${GITHUB_RUN_ID}" \
            -o live.xml
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          x = open("live.xml", encoding="utf-8").read()
          ET.fromstring(x)                                   # must parse
          assert "<![CDATA[<![CDATA[" not in x, "double CDATA regression"
          assert "__ptq.gif" not in x, "tracking pixel regression"
          assert "b2idigital.com/news" not in x, "news content leaked in"
          n = x.count("<item>")
          removing = "${{ inputs.remove_match }}" != ""
          if not removing:
              assert n > 0, "feed has no items"
          print("live feed OK: %d item(s), %d bytes" % (n, len(x.encode())))
          PY
